# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: settings_reset

  - board: seeeduino_xiao_ble
    shield: totem_left
    keymap: qwerty
    format: bt
    artifact-name: totem_qwerty_left
  - board: seeeduino_xiao_ble
    shield: totem_right
    keymap: qwerty
    format: bt
    artifact-name: totem_qwerty_right

  - board: seeeduino_xiao_ble
    shield: totem_left
    keymap: qwerty
    format: dongle
    artifact-name: totem_qwerty_dongle_left
  - board: seeeduino_xiao_ble
    shield: totem_right
    keymap: qwerty
    format: dongle
    artifact-name: totem_qwerty_dongle_right
  - board: seeeduino_xiao_ble
    shield: totem_dongle
    keymap: qwerty
    format: dongle
    artifact-name: totem_qwerty_dongle
  - board: seeeduino_xiao_ble
    shield: totem_dongle_prospector prospector_adapter
    keymap: qwerty
    format: dongle
    snippet: studio-rpc-usb-uart
    artifact-name: totem_qwerty_dongle_prospector
  - board: seeeduino_xiao_ble
    keymap: qwerty
    format: dongle
    shield: totem_dongle dongle_screen
    artifact-name: totem_qwerty_dongle_yads